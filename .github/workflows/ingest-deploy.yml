name: ingest-deploy

on:
  push:
    branches: [main]
    paths:
      - "ingest/**"
      - "!ingest/README.md"
      - ".github/workflows/ingest-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: ingest
  REPO_NAME: gharchive
  JOB_NAME: gharchive

concurrency:
  group: ingest-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: configure docker auth
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: build image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO_NAME}/${IMAGE_NAME}"
          docker build -t "${IMAGE}:${{ github.sha }}" .
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: push image
        run: docker push "${IMAGE}:${{ github.sha }}"

      - name: update Cloud Run Job image
        run: |
          gcloud run jobs update "${JOB_NAME}" \
            --image="${IMAGE}:${{ github.sha }}" \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}"
