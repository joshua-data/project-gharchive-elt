version: 2

models:
  - name: core_snp_fact__daily_active_repos
    config:
      meta:
        owner: joshua
      tags: ["core", "fact", "periodic-snapshot-fact"]
      materialized: incremental
      incremental_strategy: insert_overwrite
      on_schema_change: append_new_columns
      partition_by:
        field: date
        data_type: date
        granularity: day
      require_partition_filter: true
      cluster_by:
        - repo_id
    description: |
      Activated Repos (AU pattern applied at the repo grain) periodic snapshot
      fact — one row per `(repo_id, date)` where at least one event was triggered
      on that repository on that UTC calendar day.

      - Grain: one (repo, day).
      - Primary key: (`repo_id`, `date`).
      - Source: `stg_fact__events`, filtered to `repo_id is not null`
        (excludes the rare ~6-in-1M rows where the upstream Events API emitted
        an empty `repo` object — see the `repo_id` column doc).
      - Partitioned by: `date` (day)
      - Clustered by: `repo_id`

      Activation is binary — the row's existence encodes it. `events_count`
      records the total event volume contribution on the repo that day;
      `active_days = 1` for every daily row, kept so daily / weekly / monthly
      grains share the same column shape.

      No `is_public` filter applied — `stg_fact__events` is already the public
      feed; the rare non-public rows still represent activity.

      Incremental strategy: `insert_overwrite` with dynamic partition discovery
      — dbt overwrites exactly the `date` partitions present in the model's
      output, which is scoped by `batch_filter` to the active batch window.
    columns:
      - name: repo_id
        description: '{{ doc("repo_id") }}'
      - name: date
        description: '{{ doc("date") }}'
      - name: events_count
        description: '{{ doc("events_count") }}'
      - name: active_days
        description: '{{ doc("active_days") }}'
