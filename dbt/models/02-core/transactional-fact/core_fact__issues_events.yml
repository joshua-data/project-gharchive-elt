version: 2

models:
  - name: core_fact__issues_events
    config:
      meta:
        owner: joshua
      tags: ["core", "fact", "transactional-fact"]
      materialized: incremental
      incremental_strategy: insert_overwrite
      on_schema_change: append_new_columns
      partition_by:
        field: created_date
        data_type: date
        granularity: day
      require_partition_filter: true
      cluster_by:
        - repo_id
        - user_id
    description: |
      One row per `IssuesEvent` — an action was taken on an issue.
      (https://docs.github.com/en/rest/using-the-rest-api/github-event-types#issuesevent)

      - Grain: one event (one action on one issue).
      - Primary key: `event_id`.
      - Source: `stg_fact__events` filtered to `event_name = 'issues_event'`.
      - Partitioned by: `created_date` (day)
      - Clustered by: (`repo_id`, `user_id`)

      The issue snapshot under `issue_*` is captured at event time — `issue_state`, `issue_comments`, `issue_updated_at`
      etc. reflect state as-of when the event fired.
      To identify PR-style issues, check whether `issue_pull_request_object_url IS NOT NULL` — GitHub models PRs as
      a specialization of issues, so PR activity also flows through `IssuesEvent` for actions like `assigned` / `labeled`.

      `label_*` / `labels` columns are populated only on `labeled` / `unlabeled` actions;
      `assignee_*` columns only on `assigned` / `unassigned`.
      `changes_*` columns only on `edited`.
    columns:
      - name: event_id
        description: '{{ doc("event_id") }}'
      - name: event_name
        description: '{{ doc("event_name") }}'
      - name: created_date
        description: '{{ doc("created_date") }}'
      - name: created_at
        description: '{{ doc("created_at") }}'
      - name: ingested_date
        description: '{{ doc("ingested_date") }}'
      - name: ingested_at
        description: '{{ doc("ingested_at") }}'
      - name: user_id
        description: '{{ doc("user_id") }}'
      - name: user_name
        description: '{{ doc("user_name") }}'
      - name: user_display_name
        description: '{{ doc("user_display_name") }}'
      - name: user_object_url
        description: '{{ doc("user_object_url") }}'
      - name: user_image_url
        description: '{{ doc("user_image_url") }}'
      - name: repo_id
        description: '{{ doc("repo_id") }}'
      - name: repo_name
        description: '{{ doc("repo_name") }}'
      - name: repo_object_url
        description: '{{ doc("repo_object_url") }}'
      - name: org_id
        description: '{{ doc("org_id") }}'
