version: 2

models:
  - name: core_fact__gollum_events
    config:
      meta:
        owner: joshua
      tags: ["core", "fact", "transactional-fact"]
      materialized: incremental
      incremental_strategy: insert_overwrite
      on_schema_change: append_new_columns
      partition_by:
        field: created_date
        data_type: date
        granularity: day
      require_partition_filter: true
      cluster_by:
        - repo_id
        - user_id
    description: |
      One row per `GollumEvent` — one or more wiki pages were created or edited in a repository.
      ("Gollum" is the name of the wiki rendering engine GitHub uses.)
      (https://docs.github.com/en/rest/using-the-rest-api/github-event-types#gollumevent)

      - Grain: one event (which may bundle multiple page changes).
      - Primary key: `event_id`.
      - Source: `stg_fact__events` filtered to `event_name = 'gollum_event'`.
      - Partitioned by: `created_date` (day)
      - Clustered by: (`repo_id`, `user_id`)

      **Repeated nested column**: a single event can describe N page changes. Rather than fanning out and breaking
      the `event_id` grain, the per-page records are kept as a `pages` ARRAY<STRUCT<...>>. Each element has its own
      `action` (e.g. `created`, `edited`), so the discriminator lives inside the array, not at the event root.
      To analyze per-page, `cross join unnest(pages)`.
    columns:
      - name: event_id
        description: '{{ doc("event_id") }}'
      - name: event_name
        description: '{{ doc("event_name") }}'
      - name: created_date
        description: '{{ doc("created_date") }}'
      - name: created_at
        description: '{{ doc("created_at") }}'
      - name: ingested_date
        description: '{{ doc("ingested_date") }}'
      - name: ingested_at
        description: '{{ doc("ingested_at") }}'
      - name: user_id
        description: '{{ doc("user_id") }}'
      - name: user_name
        description: '{{ doc("user_name") }}'
      - name: user_display_name
        description: '{{ doc("user_display_name") }}'
      - name: user_object_url
        description: '{{ doc("user_object_url") }}'
      - name: user_image_url
        description: '{{ doc("user_image_url") }}'
      - name: repo_id
        description: '{{ doc("repo_id") }}'
      - name: repo_name
        description: '{{ doc("repo_name") }}'
      - name: repo_object_url
        description: '{{ doc("repo_object_url") }}'
      - name: org_id
        description: '{{ doc("org_id") }}'
      - name: org_name
        description: '{{ doc("org_name") }}'
      - name: org_object_url
        description: '{{ doc("org_object_url") }}'
      - name: org_image_url
        description: '{{ doc("org_image_url") }}'
      - name: is_public
        description: '{{ doc("is_public") }}'
      - name: pages
        description: '{{ doc("gollum_pages") }}'
      - name: pages.page_name
        description: '{{ doc("gollum_pages_page_name") }}'
      - name: pages.title
        description: '{{ doc("gollum_pages_title") }}'
      - name: pages.summary
        description: '{{ doc("gollum_pages_summary") }}'
      - name: pages.action
        description: '{{ doc("gollum_pages_action") }}'
      - name: pages.sha
        description: '{{ doc("gollum_pages_sha") }}'
      - name: pages.html_url
        description: '{{ doc("gollum_pages_html_url") }}'
