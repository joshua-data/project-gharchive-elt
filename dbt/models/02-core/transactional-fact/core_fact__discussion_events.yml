version: 2

models:
  - name: core_fact__discussion_events
    config:
      meta:
        owner: joshua
      tags: ["core", "fact", "transactional-fact"]
      materialized: incremental
      incremental_strategy: insert_overwrite
      on_schema_change: append_new_columns
      partition_by:
        field: created_date
        data_type: date
        granularity: day
      require_partition_filter: true
      cluster_by:
        - repo_id
        - user_id
    description: |
      One row per `DiscussionEvent` — a GitHub Discussions thread was created (or otherwise acted upon).
      (https://docs.github.com/en/rest/using-the-rest-api/github-event-types#discussionevent)

      - Grain: one event.
      - Primary key: `event_id`.
      - Source: `stg_fact__events` filtered to `event_name = 'discussion_event'`.
      - Partitioned by: `created_date` (day)
      - Clustered by: (`repo_id`, `user_id`)

      Low volume in the public feed (hundreds per day vs. millions for `push_event`).
      The `created` action dominates; the upstream webhook supports other actions (`edited`, `deleted`,
      `pinned`, `unpinned`, `locked`, `unlocked`, `transferred`, `category_changed`, `answered`, `unanswered`,
      `labeled`, `unlabeled`) but they're rare in the public stream.
    columns:
      - name: event_id
        description: '{{ doc("event_id") }}'
      - name: event_name
        description: '{{ doc("event_name") }}'
      - name: created_date
        description: '{{ doc("created_date") }}'
      - name: created_at
        description: '{{ doc("created_at") }}'
      - name: ingested_date
        description: '{{ doc("ingested_date") }}'
      - name: ingested_at
        description: '{{ doc("ingested_at") }}'
      - name: user_id
        description: '{{ doc("user_id") }}'
      - name: user_name
        description: '{{ doc("user_name") }}'
      - name: user_display_name
        description: '{{ doc("user_display_name") }}'
